name: Cross-platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ["24.15.0", "26"]
    steps:
      # v7 runs on Node 24 (v4 targeted the deprecated Node 20 runtime). The job never
      # pushes, so the token is not left in the checkout's git config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Windows media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg installation failed' }
      - name: Configure Windows browser and PDF tests
        if: runner.os == 'Windows' && matrix.node == '26'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'poppler.zip'
          Invoke-WebRequest 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0') { throw 'Poppler checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'poppler')
          Join-Path $env:RUNNER_TEMP 'poppler/poppler-26.09.0/Library/bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $browser = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (!(Test-Path -LiteralPath $browser -PathType Leaf)) { throw 'The runner image does not provide Google Chrome' }
          "TEST_BROWSER_EXECUTABLE=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Linux test tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Azure's regional mirror can transfer continuously at ~100 kB/s, avoiding
          # apt's inactivity timeout. Prefer Ubuntu HTTPS while retaining fallbacks.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              -e '\|^https://archive\.ubuntu\.com/ubuntu/|s/priority:2/priority:1/' \
              -e '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|s/priority:1/priority:2/' \
              /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          if [[ '${{ matrix.node }}' == '26' ]]; then
            sudo apt-get install --no-install-recommends -y poppler-utils fonts-noto-cjk
            browser="$(command -v google-chrome || command -v google-chrome-stable)"
            # Pin the runner's selected executable; browser tests also cover aliases.
            browser="$(readlink -f "$browser")"
            test -f "$browser" && test -x "$browser"
            printf 'TEST_BROWSER_EXECUTABLE=%s\n' "$browser" >> "$GITHUB_ENV"
          fi
      - name: Install macOS test tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list --versions ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          if [[ '${{ matrix.node }}' == '26' ]]; then
            brew list --versions poppler >/dev/null 2>&1 || brew install poppler
            browser='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
            test -x "$browser"
            printf 'TEST_BROWSER_EXECUTABLE=%s\n' "$browser" >> "$GITHUB_ENV"
          fi
      - run: npm ci --engine-strict --no-audit --no-fund
      # Korean Windows users have non-ASCII profile and temp paths; hosted
      # runners do not. Every test that makes a temporary directory uses one.
      - name: Use a Korean temporary directory with spaces on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP '임시 폴더 (테스트)'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $env_file = $env:GITHUB_ENV
          "TEMP=$temp" | Out-File -FilePath $env_file -Append -Encoding utf8
          "TMP=$temp" | Out-File -FilePath $env_file -Append -Encoding utf8
      - name: Exercise CRLF checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'templates/player.js'
          $text = [IO.File]::ReadAllText($file) -replace '\r\n?', "`n"
          [IO.File]::WriteAllText($file, ($text -replace '\n', "`r`n"), [Text.UTF8Encoding]::new($false))
      - run: npm run check
      - run: npm test
      # The browser is the same for both Node versions on each OS. Run its complete
      # suite once per OS; the minimum Node version still runs every core test.
      - name: Verify browser test prerequisites
        if: matrix.node == '26'
        run: |
          node --input-type=module -e "import { accessSync, constants, lstatSync } from 'node:fs'; import { execFileSync } from 'node:child_process'; const browser = process.env.TEST_BROWSER_EXECUTABLE; if (!lstatSync(browser).isFile()) throw new Error('Browser must be a regular file; resolve symlinks first.'); accessSync(browser, constants.X_OK); for (const tool of ['pdftotext', 'pdfinfo']) execFileSync(tool, ['-v'], { stdio: 'inherit' });"
      - name: Browser and PDF regression tests
        if: matrix.node == '26'
        # The suite takes about three minutes. A wedged browser should fail this
        # step with its diagnostics, not run into the job limit and be cancelled.
        timeout-minutes: 12
        env:
          TEST_BROWSER_ARTIFACTS: ${{ runner.temp }}/video-browser-debug
          # Hosted macOS runners are VMs whose paravirtual GPU faults under Chrome's
          # Metal work until the kernel ignores Chrome's GPU process and pages freeze
          # (kernel log: "Deny submissions/ignore app[Google Chrome He]"). Other runners
          # and local runs keep the GPU path.
          TEST_BROWSER_ARGS: ${{ runner.os == 'macOS' && '--disable-gpu' || '' }}
        # Browser instances are memory/CPU intensive; keep all tests while
        # avoiding oversubscription on hosted runners. No retries hide failures.
        run: node --test --test-concurrency=2 tests/browser/*.test.mjs
      - name: Retain synthetic browser failure diagnostics
        if: failure() && matrix.node == '26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-debug-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/video-browser-debug
          if-no-files-found: ignore
          retention-days: 7
